<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="chat-container">
            <div id="sidebar">
                <div class="header-sidebar">
                    <h3>Chat</h3>
                    <button id="logoutBtn" class="logout-btn">Salir</button>
                </div>
                <select id="userList">
                    <option value="">Chat público</option>
                </select>
                <div id="onlineUsers"></div>
            </div>
            <div id="main-content">
                <ul id="messages"></ul>
                <form id="form">
                    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <audio id="notificationSound" src="audio/notificacion.mp3"></audio>
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
